[tool.poetry]
name = "face-match"
version = "3.0.0"
description = ""
authors = [
    "Andrew Lin <andrewlin@umass.edu>",
    "David Thibodeau <dpthibodeau@umass.edu>",
    "Xinyuan Xu <xinyuanx@umass.edu>",
    "Anju S <asanthoshkum@umass.edu>",
    "Rigved Manoj <rmanoj@umass.edu>"
]
packages = [{include = "face_detection_recognition"}]

[tool.poetry.scripts]
face-match = "face_detection_recognition.face_match_server:app"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas="*"
ruff="*"
python-dotenv="*"
onnxruntime = "*"
matplotlib="*"
opencv-python="*"
numpy="*"
sqlmodel = "*"
sqlalchemy = "*"
pgvector = "*"
psycopg2-binary = "*"
rb-api = { path = "../rb-api", develop = true }
rb-lib = { path = "../rb-lib", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"