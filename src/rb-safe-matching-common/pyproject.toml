[tool.poetry]
name = "rb-safe-matching-common"
version = "3.0.0"
description = "Shared essay, privacy and hash modules for RescueBox safe matching"
authors = ["RescueBox Team"]
packages = [{include = "rb"}]

[tool.poetry.dependencies]
python = "^3.12"
ollama = "*"
presidio-analyzer = "^2.2.366"
presidio-anonymizer = "^2.2.366"
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
rb-lib = { path = "../rb-lib", develop = true }


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
