[tool.poetry]
name = "rescuebox"
version = "3.0.0"
description = ""
authors = ["RescueBox Team"]
packages = [{include = "rescuebox"}]

[tool.poetry.scripts]
rescuebox = "rescuebox.main:app"

[tool.poetry.dependencies]
virtualenv = ">=20.26.6,<20.33.0"
requests = "^2.32.3"
python = ">=3.11,<3.13"
pyyaml = "^6.0.2"
typer = "^0.12.5"
llvmlite = "^0.44.0"
pytest = "^8.3.4"
httpx = "^0.28.1"
# add dependencies common to all plugins here
numpy = "2.1"
# torch = "2.7.1"
nvidia-cudnn-cu12 = {version = "9.5.1.17",  platform = "win32"}
nvidia-cuda-runtime-cu12 = {version = "12.6.77",  platform = "win32"}
opencv-python = ">=4.11.0.86,<5.0.0.0"
ollama = ">=0.4.7,<0.5.0"
pypdf2 = ">=3.0.1,<4.0.0"
chromadb = "^1.0.4"
pandas = ">=2.2.3,<3.0.0"
pillow = ">=11.2.1,<12.0.0"

rb-lib = { path = "src/rb-lib", develop = true }

file-utils = { path = "src/file-utils", develop = true }
doc-parser = { path = "src/doc-parser", develop = true }
audio-transcription = { path = "src/audio-transcription", develop = true }
age-and-gender-detection = { path = "src/age_and_gender_detection", develop = true }
text-summary = {path = "src/text-summary", develop = true}
face-match = {path = "src/face-detection-recognition", develop = true }
deepfake-detection = {path = "src/deepfake-detection", develop = true}
ufdr-mounter = { path = "src/ufdr-mounter", develop = true }
image-summary = { path = "src/image-summary", develop = true }
text-embeddings = { path = "src/text-embeddings", develop = true }
image-embeddings = { path = "src/image-embeddings", develop = true }

# Don't add new packages here, add them appropriately in the list above
beautifulsoup4 = "^4.13.3"
nicegui = "3.2"

# for text_embeddings
torch = "2.7.1"
transformers = "^4.40.0"
sentence-transformers = "3.0.1"

# Text Processing
langchain-text-splitters = "^1.0"

# Database
sqlmodel = "^0.0.27"
psycopg2-binary = "^2.9.11"
pgvector = "^0.4.1"

# ONNX Runtime: use manual pip install for GPU on arm64 (chromadb pulls CPU version, overwrites GPU)
# See docs/DGX_SPARK.md for: pip install https://github.com/ultralytics/assets/releases/download/v0.0.0/onnxruntime_gpu-1.24.0-cp312-cp312-linux_aarch64.whl

# current environment is ARM aarch64 !!

# macOS: install CPU onnxruntime from PyPI. Linux aarch64: use manual GPU wheel (see comment above).
onnxruntime = { version = "1.24.4", markers = "sys_platform == 'darwin'" }

# for linux and windows refer to pyproject.toml in main branch and inlcude it here


cmake = "^4.2.3"
ninja = "^1.13.0"
packaging = ">=23.2"
wheel = "^0.46.3"
llama-cpp-python = "^0.3.16"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"

pytest = "^8.3.3"
pytest-asyncio = "^1.3.0"
ruff = "^0.7.1"
pre-commit = "^4.0.1"

[tool.poetry.group.api.dependencies]
rb-api = { path = "src/rb-api", develop = true }

[tool.poetry.group.bundling.dependencies]
pyinstaller = "^5.13.2"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
