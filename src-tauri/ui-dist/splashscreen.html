<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RescueBox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #1c1c1c 0%, #2d2d2d 45%, #881c1c 140%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .panel {
      text-align: center;
      padding: 2rem 2.5rem;
      max-width: 22rem;
    }
    .title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }
    .spinner {
      width: 2.75rem;
      height: 2.75rem;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #f87171;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .spinner.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
      min-height: 2.5em;
    }
    .status.error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="spinner" id="startup-spinner" aria-hidden="true"></div>
    <h1 class="title">RescueBox</h1>
    <p class="subtitle" id="startup-subtitle">Setup rescuebox assistant&hellip;</p>
    <p class="status" id="startup-status">Initializing&hellip;</p>
  </div>
  <script>
    window.setStartupStatus = function (text) {
      const el = document.getElementById("startup-status");
      if (!el) return;
      el.textContent = text;
      el.classList.remove("error");
    };
    window.setStartupError = function (text) {
      const el = document.getElementById("startup-status");
      const sub = document.getElementById("startup-subtitle");
      const spin = document.getElementById("startup-spinner");
      if (sub) sub.textContent = "Startup failed";
      if (el) {
        el.textContent = text;
        el.classList.add("error");
      }
      if (spin) spin.classList.add("hidden");
    };
  </script>
</body>
</html>
